[package]
name = "channelbridge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
channelbridge-core = { path = "../core" }
channelbridge-macos = { path = "../macos" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSControl", "NSTextField", "NSRunningApplication", "NSGraphics", "NSPopUpButton", "NSButton", "NSMenu", "NSMenuItem"] }
