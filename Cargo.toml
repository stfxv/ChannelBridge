[workspace]
resolver = "3"
members = ["crates/core", "crates/audio", "crates/contract", "crates/hal-abi", "crates/driver", "crates/macos", "crates/app"]

[workspace.package]
version = "0.5.8"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Native entry guards are defense in depth; normal errors do not use panics.
panic = "unwind"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
missing_safety_doc = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
