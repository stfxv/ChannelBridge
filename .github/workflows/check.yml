name: Legacy Go checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Controller, mixer, UI, and driver regressions
        run: bash scripts/test-legacy-go.sh
      - name: Build and verify application signature
        run: bash scripts/build-legacy-go.sh
